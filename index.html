<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Routinery Skill Registry</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f6f6f9;
  --card: #ffffff;
  --border: rgba(0,0,0,0.06);
  --text1: #111827;
  --text2: #6b7280;
  --text3: #9ca3af;
  --accent: #4f46e5;
  --accent-light: #eef2ff;
  --green: #059669;
  --green-light: #ecfdf5;
  --orange: #d97706;
  --orange-light: #fffbeb;
  --pink: #db2777;
  --pink-light: #fdf2f8;
  --cyan: #0891b2;
  --cyan-light: #ecfeff;
  --purple: #7c3aed;
  --purple-light: #f5f3ff;
  --red: #dc2626;
  --red-light: #fef2f2;
  --human: #f59e0b;
  --human-light: #fffbeb;
  --agent-color: #4f46e5;
  --human-color: #f59e0b;
  --trigger-color: #9ca3af;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
  background: var(--bg); color: var(--text1);
  min-height: 100vh; -webkit-font-smoothing: antialiased;
}

.page { max-width: 1120px; margin: 0 auto; padding: 0 24px 80px; }

/* ── Header ── */
.header {
  padding: 48px 0 0;
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
}
.header-left h1 {
  font-size: 28px; font-weight: 800; letter-spacing: -0.03em;
  display: flex; align-items: center; gap: 10px;
}
.header-left h1 img { width: 32px; height: 32px; border-radius: 8px; }
.header-left p { color: var(--text3); font-size: 14px; margin-top: 4px; }
.header-right { display: flex; gap: 8px; }
.btn {
  padding: 9px 18px; border-radius: 10px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--border); background: var(--card); color: var(--text1);
  cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: rgba(0,0,0,0.12); box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: #4338ca; }

/* ── Tabs ── */
.main-tabs {
  display: flex; gap: 0; margin-top: 28px;
  border-bottom: 2px solid var(--border);
}
.main-tab {
  padding: 12px 24px; background: none; border: none;
  font-size: 15px; font-weight: 600; color: var(--text3);
  cursor: pointer; border-bottom: 2px solid transparent;
  margin-bottom: -2px; transition: all 0.15s;
}
.main-tab:hover { color: var(--text2); }
.main-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.main-tab .tab-count {
  font-size: 11px; background: rgba(0,0,0,0.05); padding: 1px 7px;
  border-radius: 5px; margin-left: 6px;
}
.main-tab.active .tab-count { background: var(--accent-light); color: var(--accent); }

/* ── Stats ── */
.stats { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
.stat {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 20px; min-width: 140px; flex: 1;
}
.stat-value { font-size: 28px; font-weight: 800; }
.stat-label { font-size: 12px; color: var(--text3); margin-top: 2px; }

/* ── Toolbar ── */
.toolbar { display: flex; gap: 8px; margin-top: 20px; align-items: center; flex-wrap: wrap; }
.search-wrap { flex: 1; min-width: 200px; position: relative; }
.search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); }
.search-wrap input {
  width: 100%; padding: 10px 14px 10px 38px;
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  font-size: 14px; color: var(--text1); outline: none;
}
.search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
.search-wrap input::placeholder { color: var(--text3); }
.filter-group { display: flex; gap: 4px; flex-wrap: wrap; }
.chip {
  padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 500;
  border: 1px solid transparent; background: transparent; color: var(--text3);
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.chip:hover { color: var(--text2); background: rgba(0,0,0,0.03); }
.chip.active { color: var(--accent); background: var(--accent-light); border-color: rgba(79,70,229,0.15); }

/* ── Card grid ── */
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 12px; margin-top: 20px;
}
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 20px; transition: all 0.2s; cursor: pointer; position: relative;
}
.card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); border-color: rgba(0,0,0,0.1); }
.card-top { display: flex; align-items: flex-start; gap: 12px; }
.card-icon {
  width: 42px; height: 42px; border-radius: 11px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 20px;
}
.card-info { flex: 1; min-width: 0; }
.card-name { font-size: 15px; font-weight: 700; }
.card-cmd { font-size: 11px; color: var(--accent); font-family: 'SF Mono', monospace; font-weight: 500; margin-top: 1px; }
.card-desc { font-size: 13px; color: var(--text2); line-height: 1.5; margin-top: 8px; }
.card-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 10px; }
.tag { font-size: 10px; font-weight: 500; padding: 3px 8px; border-radius: 5px; background: rgba(0,0,0,0.04); color: var(--text3); }
.tag-type { background: var(--accent-light); color: var(--accent); }
.tag-platform { background: var(--green-light); color: var(--green); }
.tag-integration { background: var(--purple-light); color: var(--purple); }
.card-author { font-size: 11px; color: var(--text3); margin-top: 10px; }
.card-schedule {
  position: absolute; top: 12px; right: 12px;
  font-size: 10px; font-weight: 600; color: var(--green);
  background: var(--green-light); padding: 3px 8px; border-radius: 5px;
}
.card-detail { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
.card.expanded .card-detail { display: block; }
.detail-row { display: flex; gap: 8px; margin-bottom: 8px; font-size: 12px; }
.detail-label { color: var(--text3); min-width: 56px; flex-shrink: 0; }
.detail-value { color: var(--text2); }
.cat-기획 { background: var(--accent-light); color: var(--accent); }
.cat-디자인 { background: var(--pink-light); color: var(--pink); }
.cat-개발 { background: var(--cyan-light); color: var(--cyan); }
.cat-운영 { background: var(--orange-light); color: var(--orange); }
.cat-릴리즈 { background: var(--green-light); color: var(--green); }
.cat-지식관리 { background: var(--purple-light); color: var(--purple); }
.cat-자동화 { background: var(--cyan-light); color: var(--cyan); }
.cat-QA { background: var(--red-light); color: var(--red); }

/* ── Workflow ── */
.workflow-list { margin-top: 20px; display: flex; flex-direction: column; gap: 16px; }
.wf-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  overflow: hidden; transition: box-shadow 0.2s;
}
.wf-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.wf-header {
  padding: 20px 24px; cursor: pointer; display: flex; align-items: center; gap: 16px;
}
.wf-team {
  font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 6px;
  background: var(--accent-light); color: var(--accent); white-space: nowrap;
}
.wf-title { font-size: 17px; font-weight: 700; flex: 1; }
.wf-meta { font-size: 12px; color: var(--text3); display: flex; gap: 12px; }
.wf-meta span { display: flex; align-items: center; gap: 3px; }
.wf-chevron { font-size: 20px; color: var(--text3); transition: transform 0.2s; }
.wf-card.open .wf-chevron { transform: rotate(90deg); }
.wf-body { display: none; padding: 0 24px 24px; }
.wf-card.open .wf-body { display: block; }
.wf-desc { font-size: 13px; color: var(--text2); margin-bottom: 20px; line-height: 1.5; }

/* Pipeline visualization */
.pipeline { display: flex; flex-direction: column; gap: 0; position: relative; }
.pipe-step {
  display: flex; align-items: stretch; gap: 0; position: relative;
  min-height: 72px;
}
.pipe-line {
  width: 48px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center;
  position: relative;
}
.pipe-dot {
  width: 14px; height: 14px; border-radius: 50%; border: 3px solid;
  z-index: 1; margin-top: 18px; flex-shrink: 0;
}
.pipe-dot.agent { border-color: var(--agent-color); background: var(--accent-light); }
.pipe-dot.human { border-color: var(--human-color); background: var(--human-light); }
.pipe-dot.trigger { border-color: var(--trigger-color); background: #f3f4f6; }
.pipe-connector {
  flex: 1; width: 2px; background: #e5e7eb; margin-top: 4px;
}
.pipe-step:last-child .pipe-connector { display: none; }

.pipe-content {
  flex: 1; padding: 10px 0 10px 12px; min-width: 0;
}
.pipe-content-inner {
  background: var(--bg); border-radius: 10px; padding: 12px 16px;
  border-left: 3px solid transparent;
}
.pipe-content-inner.agent { border-left-color: var(--agent-color); }
.pipe-content-inner.human { border-left-color: var(--human-color); }
.pipe-content-inner.trigger { border-left-color: var(--trigger-color); }
.pipe-content-inner.gap {
  border-left-color: var(--red);
  background: var(--red-light);
}
.pipe-name { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.pipe-badge {
  font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px;
}
.pipe-badge.agent { background: var(--accent-light); color: var(--accent); }
.pipe-badge.human { background: var(--human-light); color: var(--human-color); }
.pipe-badge.trigger { background: #f3f4f6; color: var(--text3); }
.pipe-badge.gap { background: var(--red-light); color: var(--red); }
.pipe-desc { font-size: 12px; color: var(--text2); margin-top: 4px; line-height: 1.5; }
.pipe-tools { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 6px; }
.pipe-tool { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,0.04); color: var(--text3); }
.pipe-output { font-size: 11px; color: var(--green); margin-top: 4px; font-weight: 500; }
.pipe-who { font-size: 11px; color: var(--human-color); font-weight: 500; }
.pipe-reject {
  font-size: 10px; color: var(--red); margin-top: 4px;
  display: flex; align-items: center; gap: 4px;
}

/* Parallel track */
.pipe-parallel {
  margin-top: 12px; margin-left: 48px;
  background: #fffbeb; border: 1px dashed #f59e0b; border-radius: 10px;
  padding: 12px 16px;
}
.pipe-parallel-label {
  font-size: 10px; font-weight: 700; color: var(--orange);
  text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px;
}

/* Legend */
.wf-legend {
  display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap;
}
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text2); }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid; }
.legend-dot.agent { border-color: var(--agent-color); background: var(--accent-light); }
.legend-dot.human { border-color: var(--human-color); background: var(--human-light); }
.legend-dot.trigger { border-color: var(--trigger-color); background: #f3f4f6; }

.no-results { text-align: center; padding: 60px 0; color: var(--text3); font-size: 14px; grid-column: 1/-1; }

/* ── Modal ── */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
  align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card); border-radius: 18px; padding: 32px;
  width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
}
.modal h2 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
.modal .subtitle { font-size: 13px; color: var(--text3); margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 5px; }
.form-group label .required { color: var(--red); }
.form-group input, .form-group textarea, .form-group select {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border);
  border-radius: 9px; font-size: 13px; color: var(--text1);
  font-family: inherit; outline: none; background: var(--bg);
}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
}
.form-group textarea { resize: vertical; min-height: 60px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; }
.output-box {
  background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px; font-family: 'SF Mono', monospace; font-size: 12px;
  white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto;
  line-height: 1.6; color: var(--text2); margin: 16px 0;
}
.output-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.output-actions .btn { font-size: 12px; padding: 8px 14px; }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: var(--text1); color: #fff; padding: 10px 20px; border-radius: 10px;
  font-size: 13px; font-weight: 500; transition: transform 0.3s; z-index: 200;
}
.toast.show { transform: translateX(-50%) translateY(0); }

@media (max-width: 768px) {
  .header { flex-direction: column; align-items: flex-start; }
  .stats { gap: 8px; }
  .stat { min-width: 0; padding: 12px 14px; }
  .stat-value { font-size: 22px; }
  .grid { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr; }
  .toolbar { flex-direction: column; }
  .wf-meta { display: none; }
}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-left">
      <h1><img src="favicon.png" alt="">Routinery Skill Registry</h1>
      <p>팀이 만든 에이전트, 스킬, 자동화 워크플로우를 한눈에</p>
    </div>
    <div class="header-right">
      <button class="btn" onclick="exportJSON()">JSON 내보내기</button>
      <button class="btn btn-primary" onclick="openForm()">+ 등록하기</button>
    </div>
  </div>

  <div class="main-tabs" id="mainTabs"></div>

  <!-- Workflows page -->
  <div id="workflowPage" style="display:none">
    <div class="toolbar">
      <div class="filter-group" id="teamFilters"></div>
    </div>
    <div class="workflow-list" id="workflowList"></div>
  </div>

  <!-- Registry page -->
  <div id="registryPage" style="display:none">
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search" placeholder="검색 -- 이름, 설명, 도구, 만든 사람..." oninput="renderRegistry()">
      </div>
      <div class="filter-group" id="categoryFilters"></div>
    </div>
    <div class="toolbar" style="margin-top:8px">
      <div class="filter-group" id="typeFilters"></div>
      <div class="filter-group" id="authorFilters"></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- Register Modal -->
<div class="modal-overlay" id="formModal">
  <div class="modal">
    <h2>새 스킬/에이전트 등록</h2>
    <p class="subtitle">등록 후 JSON을 복사하여 <code>data/registry.json</code>에 추가하세요.</p>
    <div class="form-row">
      <div class="form-group"><label>이름 <span class="required">*</span></label><input type="text" id="f-name" placeholder="예: 떡밥제조기"></div>
      <div class="form-group"><label>호출 커맨드</label><input type="text" id="f-command" placeholder="예: /pm"></div>
    </div>
    <div class="form-group"><label>한줄 설명 <span class="required">*</span></label><textarea id="f-desc" rows="2" placeholder="뭘 하는 건지 한두 문장으로"></textarea></div>
    <div class="form-row">
      <div class="form-group"><label>카테고리 <span class="required">*</span></label><select id="f-category"><option value="">선택</option><option>기획</option><option>디자인</option><option>개발</option><option>QA</option><option>릴리즈</option><option>운영</option><option>지식관리</option><option>자동화</option></select></div>
      <div class="form-group"><label>타입 <span class="required">*</span></label><select id="f-type"><option value="">선택</option><option value="agent">에이전트</option><option value="skill">스킬</option><option value="automation">자동화</option><option value="mcp">MCP 연동</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>플랫폼</label><select id="f-platform"><option>Claude Code</option><option>Claude Desktop</option><option>Cursor</option><option>GPT</option><option>기타</option></select></div>
      <div class="form-group"><label>실행 방식</label><select id="f-trigger"><option value="slash-command">슬래시 커맨드</option><option value="manual">수동 실행</option><option value="schedule">스케줄 자동</option><option value="event">이벤트 트리거</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>입력</label><input type="text" id="f-input" placeholder="뭘 넣나요?"></div>
      <div class="form-group"><label>출력</label><input type="text" id="f-output" placeholder="뭐가 나오나요?"></div>
    </div>
    <div class="form-group"><label>연동 도구</label><input type="text" id="f-integrations" placeholder="쉼표로 구분 -- Figma, Notion, Slack 등"></div>
    <div class="form-row">
      <div class="form-group"><label>아이콘 (이모지)</label><input type="text" id="f-icon" placeholder="예: 🐻" maxlength="4"></div>
      <div class="form-group"><label>만든 사람 <span class="required">*</span></label><input type="text" id="f-author" placeholder="본인 이름"></div>
    </div>
    <div class="form-group"><label>스케줄 (자동화인 경우)</label><input type="text" id="f-schedule" placeholder="예: 매일 21:00"></div>
    <div id="formOutput"></div>
    <div class="form-actions">
      <button class="btn" onclick="closeForm()">닫기</button>
      <button class="btn btn-primary" onclick="generateEntry()">JSON 생성</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">복사되었습니다</div>

<script>
// ════════════════════════════════════════
// DATA
// ════════════════════════════════════════
let REGISTRY = [];
let WORKFLOWS = [];
let mainTab = 'workflows';
let currentTeam = 'All';
let currentCategory = 'All';
let currentType = 'All';
let currentAuthor = 'All';

const TYPE_LABELS = { agent: '에이전트', skill: '스킬', automation: '자동화', mcp: 'MCP 연동' };
const CAT_COLORS = {
  '기획': { bg: 'var(--accent-light)', fg: 'var(--accent)' },
  '디자인': { bg: 'var(--pink-light)', fg: 'var(--pink)' },
  '개발': { bg: 'var(--cyan-light)', fg: 'var(--cyan)' },
  '운영': { bg: 'var(--orange-light)', fg: 'var(--orange)' },
  '릴리즈': { bg: 'var(--green-light)', fg: 'var(--green)' },
  '지식관리': { bg: 'var(--purple-light)', fg: 'var(--purple)' },
  '자동화': { bg: 'var(--cyan-light)', fg: 'var(--cyan)' },
  'QA': { bg: 'var(--red-light)', fg: 'var(--red)' },
};

// ════════════════════════════════════════

// LOAD
// ════════════════════════════════════════
async function loadData() {
  try {
    const [r1, r2] = await Promise.all([
      fetch('data/registry.json?t=' + Date.now()),
      fetch('data/workflows.json?t=' + Date.now()),
    ]);
    if (!r1.ok) throw new Error('registry');
    if (!r2.ok) throw new Error('workflows');
    REGISTRY = await r1.json();
    WORKFLOWS = await r2.json();
  } catch (e) {
    console.warn('fetch failed, using embedded data', e);
    REGISTRY = EMBEDDED_REGISTRY;
    WORKFLOWS = EMBEDDED_WORKFLOWS;
  }
  renderAll();
}

// TABS
// ════════════════════════════════════════
function renderMainTabs() {
  const gapCount = WORKFLOWS.reduce((n, w) => n + w.steps.filter(s => s.gap).length, 0);
  document.getElementById('mainTabs').innerHTML = `
    <button class="main-tab${mainTab === 'workflows' ? ' active' : ''}" onclick="switchMainTab('workflows')">
      Workflows<span class="tab-count">${WORKFLOWS.length}</span>
      ${gapCount ? `<span class="tab-count" style="background:var(--red-light);color:var(--red)">${gapCount} gaps</span>` : ''}
    </button>
    <button class="main-tab${mainTab === 'registry' ? ' active' : ''}" onclick="switchMainTab('registry')">
      Registry<span class="tab-count">${REGISTRY.length}</span>
    </button>
  `;
}

function switchMainTab(tab) {
  mainTab = tab;
  renderAll();
}

function renderAll() {
  renderMainTabs();
  document.getElementById('workflowPage').style.display = mainTab === 'workflows' ? 'block' : 'none';
  document.getElementById('registryPage').style.display = mainTab === 'registry' ? 'block' : 'none';
  if (mainTab === 'workflows') renderWorkflows();
  else { renderStats(); renderFilters(); renderRegistry(); }
}

// WORKFLOWS
// ════════════════════════════════════════
function renderWorkflows() {
  const teams = [...new Set(WORKFLOWS.map(w => w.team))];
  let filterHtml = `<button class="chip${currentTeam === 'All' ? ' active' : ''}" onclick="setTeam('All')">전체</button>`;
  teams.forEach(t => {
    filterHtml += `<button class="chip${currentTeam === t ? ' active' : ''}" onclick="setTeam('${t}')">${t}</button>`;
  });
  document.getElementById('teamFilters').innerHTML = filterHtml;

  const filtered = currentTeam === 'All' ? WORKFLOWS : WORKFLOWS.filter(w => w.team === currentTeam);
  document.getElementById('workflowList').innerHTML = filtered.map(wfCardHTML).join('');
}

function setTeam(t) { currentTeam = t; renderWorkflows(); }

function toggleWf(el) { el.closest('.wf-card').classList.toggle('open'); }

function wfCardHTML(wf) {
  const agentCount = wf.steps.filter(s => s.type === 'agent').length + (wf.parallel || []).length;
  const humanCount = wf.steps.filter(s => s.type === 'human').length;
  const gapCount = wf.steps.filter(s => s.gap).length;
  const isOpen = wf.steps.length <= 5 ? ' open' : '';

  let stepsHtml = wf.steps.map(stepHTML).join('');

  if (wf.parallel && wf.parallel.length) {
    stepsHtml += wf.parallel.map(p => `
      <div class="pipe-parallel">
        <div class="pipe-parallel-label">${p.label || '병렬 트랙'}</div>
        <div class="pipe-name">
          <span>${p.name}</span>
          <span class="pipe-badge agent">에이전트</span>
        </div>
        <div class="pipe-desc">${p.description}</div>
        ${p.tools && p.tools.length ? `<div class="pipe-tools">${p.tools.map(t => `<span class="pipe-tool">${t}</span>`).join('')}</div>` : ''}
        ${p.output ? `<div class="pipe-output">→ ${p.output}</div>` : ''}
      </div>
    `).join('');
  }

  return `<div class="wf-card${isOpen}">
    <div class="wf-header" onclick="toggleWf(this)">
      <span class="wf-team">${wf.team}</span>
      <span class="wf-title">${wf.name}</span>
      <div class="wf-meta">
        <span style="color:var(--agent-color)">🤖 ${agentCount}</span>
        <span style="color:var(--human-color)">👤 ${humanCount}</span>
        ${gapCount ? `<span style="color:var(--red)">⚠ ${gapCount} gap</span>` : ''}
      </div>
      <span class="wf-chevron">›</span>
    </div>
    <div class="wf-body">
      <div class="wf-desc">${wf.description}</div>
      <div class="wf-legend">
        <div class="legend-item"><div class="legend-dot agent"></div>에이전트</div>
        <div class="legend-item"><div class="legend-dot human"></div>사람 (게이트)</div>
        <div class="legend-item"><div class="legend-dot trigger"></div>트리거</div>
      </div>
      <div class="pipeline">${stepsHtml}</div>
    </div>
  </div>`;
}

function stepHTML(s) {
  const t = s.type;
  const badgeLabel = t === 'agent' ? '에이전트' : t === 'human' ? '사람' : '트리거';
  const gapBadge = s.gap ? `<span class="pipe-badge gap">GAP - 미수집</span>` : '';
  const tools = (s.tools || []).map(t => `<span class="pipe-tool">${t}</span>`).join('');
  const rejectHtml = s.rejectTo ? `<div class="pipe-reject">↩ REJECTED → ${s.rejectTo}</div>` : '';
  const exitHtml = s.exitCondition ? `<div class="pipe-reject" style="color:var(--orange)">↗ ${s.exitCondition}</div>` : '';

  return `<div class="pipe-step">
    <div class="pipe-line">
      <div class="pipe-dot ${t}"></div>
      <div class="pipe-connector"></div>
    </div>
    <div class="pipe-content">
      <div class="pipe-content-inner ${t}${s.gap ? ' gap' : ''}">
        <div class="pipe-name">
          <span>${s.name}</span>
          <span class="pipe-badge ${t}">${badgeLabel}</span>
          ${gapBadge}
          ${s.who ? `<span class="pipe-who">${s.who}</span>` : ''}
        </div>
        <div class="pipe-desc">${s.description}</div>
        ${tools ? `<div class="pipe-tools">${tools}</div>` : ''}
        ${s.output ? `<div class="pipe-output">→ ${s.output}</div>` : ''}
        ${rejectHtml}
        ${exitHtml}
      </div>
    </div>
  </div>`;
}

function renderStats() {
  const types = {};
  REGISTRY.forEach(d => { types[d.type] = (types[d.type] || 0) + 1; });
  const authors = new Set(REGISTRY.map(d => d.author).filter(Boolean));
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-value">${REGISTRY.length}</div><div class="stat-label">전체 등록</div></div>
    <div class="stat"><div class="stat-value">${types.agent || 0}</div><div class="stat-label">에이전트</div></div>
    <div class="stat"><div class="stat-value">${types.skill || 0}</div><div class="stat-label">스킬</div></div>
    <div class="stat"><div class="stat-value">${types.automation || 0}</div><div class="stat-label">자동화</div></div>
    <div class="stat"><div class="stat-value">${authors.size}</div><div class="stat-label">기여자</div></div>
  `;
}

function renderFilters() {
  const cats = [...new Set(REGISTRY.map(d => d.category))].sort();
  let h = `<button class="chip${currentCategory === 'All' ? ' active' : ''}" onclick="setFilter('category','All')">전체</button>`;
  cats.forEach(c => { h += `<button class="chip${currentCategory === c ? ' active' : ''}" onclick="setFilter('category','${c}')">${c}</button>`; });
  document.getElementById('categoryFilters').innerHTML = h;

  const types = [...new Set(REGISTRY.map(d => d.type))];
  let th = `<button class="chip${currentType === 'All' ? ' active' : ''}" onclick="setFilter('type','All')">전체 타입</button>`;
  types.forEach(t => { th += `<button class="chip${currentType === t ? ' active' : ''}" onclick="setFilter('type','${t}')">${TYPE_LABELS[t] || t}</button>`; });
  document.getElementById('typeFilters').innerHTML = th;

  const authors = [...new Set(REGISTRY.map(d => d.author).filter(Boolean))].sort();
  let ah = `<button class="chip${currentAuthor === 'All' ? ' active' : ''}" onclick="setFilter('author','All')">전체 멤버</button>`;
  authors.forEach(a => { ah += `<button class="chip${currentAuthor === a ? ' active' : ''}" onclick="setFilter('author','${a}')">${a}</button>`; });
  document.getElementById('authorFilters').innerHTML = ah;
}

function setFilter(dim, val) {
  if (dim === 'category') currentCategory = val;
  if (dim === 'type') currentType = val;
  if (dim === 'author') currentAuthor = val;
  renderFilters(); renderRegistry();
}

function renderRegistry() {
  const q = document.getElementById('search').value.toLowerCase();
  let items = REGISTRY;
  if (currentCategory !== 'All') items = items.filter(d => d.category === currentCategory);
  if (currentType !== 'All') items = items.filter(d => d.type === currentType);
  if (currentAuthor !== 'All') items = items.filter(d => d.author === currentAuthor);
  if (q) items = items.filter(d =>
    d.name.toLowerCase().includes(q) || d.description.toLowerCase().includes(q) ||
    (d.command || '').toLowerCase().includes(q) || (d.author || '').toLowerCase().includes(q) ||
    (d.integrations || []).some(i => i.toLowerCase().includes(q))
  );
  const el = document.getElementById('grid');
  if (!items.length) { el.innerHTML = `<div class="no-results">검색 결과가 없습니다.</div>`; return; }
  el.innerHTML = items.map(cardHTML).join('');
}

function cardHTML(d) {
  const colors = CAT_COLORS[d.category] || { bg: 'rgba(0,0,0,0.04)', fg: 'var(--text2)' };
  const integrations = (d.integrations || []).map(i => `<span class="tag tag-integration">${i}</span>`).join('');
  const scheduleHtml = d.schedule ? `<div class="card-schedule">⚡ ${d.schedule}</div>` : '';
  return `<div class="card" onclick="this.classList.toggle('expanded')">
    ${scheduleHtml}
    <div class="card-top">
      <div class="card-icon" style="background:${colors.bg};color:${colors.fg}">${d.icon || '🔧'}</div>
      <div class="card-info">
        <div class="card-name">${d.name}</div>
        ${d.command ? `<div class="card-cmd">${d.command}</div>` : ''}
      </div>
    </div>
    <div class="card-desc">${d.description}</div>
    <div class="card-tags">
      <span class="tag tag-type">${TYPE_LABELS[d.type] || d.type}</span>
      <span class="tag tag-platform">${d.platform}</span>
      ${integrations}
    </div>
    ${d.author ? `<div class="card-author">by <strong>${d.author}</strong></div>` : ''}
    <div class="card-detail">
      ${d.input ? `<div class="detail-row"><span class="detail-label">입력</span><span class="detail-value">${d.input}</span></div>` : ''}
      ${d.output ? `<div class="detail-row"><span class="detail-label">출력</span><span class="detail-value">${d.output}</span></div>` : ''}
      ${d.trigger ? `<div class="detail-row"><span class="detail-label">실행</span><span class="detail-value">${d.trigger}</span></div>` : ''}
    </div>
  </div>`;
}

// ════════════════════════════════════════
function openForm() { document.getElementById('formModal').classList.add('show'); document.getElementById('formOutput').innerHTML = ''; }
function closeForm() { document.getElementById('formModal').classList.remove('show'); }
document.getElementById('formModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeForm(); });

function generateEntry() {
  const name = document.getElementById('f-name').value.trim();
  const desc = document.getElementById('f-desc').value.trim();
  const category = document.getElementById('f-category').value;
  const type = document.getElementById('f-type').value;
  const author = document.getElementById('f-author').value.trim();
  if (!name || !desc || !category || !type || !author) { alert('필수 항목(*)을 모두 입력해주세요.'); return; }
  const id = (document.getElementById('f-command').value || name).replace(/^\//, '').replace(/\s+/g, '-').toLowerCase();
  const entry = { id, name,
    command: document.getElementById('f-command').value.trim() || undefined,
    description: desc, category, type,
    platform: document.getElementById('f-platform').value,
    trigger: document.getElementById('f-trigger').value,
    input: document.getElementById('f-input').value.trim() || undefined,
    output: document.getElementById('f-output').value.trim() || undefined,
    integrations: document.getElementById('f-integrations').value.split(',').map(s => s.trim()).filter(Boolean),
    icon: document.getElementById('f-icon').value.trim() || undefined,
    author,
    schedule: document.getElementById('f-schedule').value.trim() || undefined,
    updatedAt: new Date().toISOString().split('T')[0],
  };
  Object.keys(entry).forEach(k => entry[k] === undefined && delete entry[k]);
  const json = JSON.stringify(entry, null, 2);
  document.getElementById('formOutput').innerHTML = `
    <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px;">생성된 JSON</div>
      <div class="output-box">${escapeHtml(json)}</div>
      <div class="output-actions">
        <button class="btn" onclick="copyText(\`${json.replace(/`/g,'\\`').replace(/\\/g,'\\\\')}\`)">JSON 복사</button>
        <button class="btn btn-primary" onclick='addLocally(${escapeAttr(json)})'>바로 추가 (이 세션만)</button>
      </div>
      <p style="font-size:11px;color:var(--text3);margin-top:10px;">영구 반영: <code>data/registry.json</code> 배열에 추가 후 push</p>
    </div>`;
}

function addLocally(entry) {
  if (typeof entry === 'string') entry = JSON.parse(entry);
  REGISTRY.push(entry);
  closeForm();
  renderAll();
  showToast('추가되었습니다 (이 세션만)');
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s) { return s.replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }

function exportJSON() {
  const blob = new Blob([JSON.stringify({ registry: REGISTRY, workflows: WORKFLOWS }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'skill-dashboard-export.json'; a.click();
  URL.revokeObjectURL(url);
}

function copyText(text) { navigator.clipboard.writeText(text); showToast('복사되었습니다'); }
function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg;
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800);
}

loadData();
</script>
</body>
</html>
