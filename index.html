<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Routinery Skill Registry</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #eae5f0;
  --card: rgba(255,255,255,0.65);
  --card-hover: rgba(255,255,255,0.85);
  --border: rgba(0,0,0,0.05);
  --text1: #1a1a2e;
  --text2: #555;
  --text3: #999;
  --accent: #6c5ce7;
  --accent-light: rgba(108,92,231,0.08);
  --green: #00b894;
  --green-light: rgba(0,184,148,0.08);
  --orange: #e17055;
  --orange-light: rgba(225,112,85,0.08);
  --pink: #e84393;
  --pink-light: rgba(232,67,147,0.08);
  --cyan: #0984e3;
  --cyan-light: rgba(9,132,227,0.08);
  --purple: #6c5ce7;
  --purple-light: rgba(108,92,231,0.08);
  --red: #d63031;
  --red-light: rgba(214,48,49,0.08);
  --human-color: #fdcb6e;
  --agent-color: #6c5ce7;
  --trigger-color: #b2bec3;
}

body {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: linear-gradient(180deg, #e8e0f0 0%, #dce8e8 40%, #eaeef2 100%);
  background-attachment: fixed;
  color: var(--text1); min-height: 100vh; -webkit-font-smoothing: antialiased;
}

.page { max-width: 1080px; margin: 0 auto; padding: 0 24px 80px; }

/* ── Header ── */
.site-header {
  padding: 48px 0 0;
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
}
.site-header-left { display: flex; align-items: center; gap: 14px; }
.site-header-left img { width: 40px; height: 40px; border-radius: 10px; }
.site-header-left h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; }
.site-header-left p { font-size: 13px; color: var(--text3); margin-top: 2px; }

/* ── Top bar ── */
.top-bar {
  display: flex; align-items: center; gap: 8px;
  margin-top: 20px; flex-wrap: wrap;
}
.search-wrap { flex: 1; min-width: 200px; position: relative; }
.search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #aaa; }
.search-wrap input {
  width: 100%; padding: 10px 16px 10px 40px;
  background: var(--card); backdrop-filter: blur(8px);
  border: 1px solid var(--border); border-radius: 12px;
  color: var(--text1); font-size: 14px; outline: none;
}
.search-wrap input:focus { border-color: rgba(108,92,231,0.3); background: rgba(255,255,255,0.9); }
.search-wrap input::placeholder { color: #bbb; }

.btn {
  padding: 9px 18px; border-radius: 12px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--border); background: var(--card); backdrop-filter: blur(8px);
  color: var(--text1); cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; gap: 6px;
}
.btn:hover { background: var(--card-hover); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: #5a4bd6; }

/* ── Main Tabs ── */
.main-tabs {
  display: flex; gap: 0; margin-top: 18px;
  border-bottom: 1px solid rgba(0,0,0,0.06);
}
.main-tab {
  padding: 14px 24px; background: none; border: none;
  font-size: 17px; font-weight: 600; color: #aaa;
  cursor: pointer; border-bottom: 3px solid transparent;
  margin-bottom: -1px; transition: color 0.15s;
  display: flex; align-items: center; gap: 8px;
}
.main-tab:hover { color: #555; }
.main-tab.active { color: #111; border-bottom-color: #111; }
.tab-count {
  font-size: 13px; color: #bbb; background: rgba(0,0,0,0.04);
  padding: 2px 8px; border-radius: 6px;
}
.main-tab.active .tab-count { color: #666; background: rgba(0,0,0,0.07); }
.tab-gap-count {
  font-size: 11px; color: var(--red); background: var(--red-light);
  padding: 2px 8px; border-radius: 6px; font-weight: 600;
}

/* ── Sub-filters ── */
.sub-filters {
  margin-top: 14px; display: flex; gap: 4px; flex-wrap: wrap;
}
.chip {
  padding: 8px 16px; border-radius: 10px; border: none;
  background: transparent; color: #999; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.15s; min-height: 36px;
}
.chip:hover { color: #555; background: rgba(0,0,0,0.04); }
.chip.active { color: #111; background: rgba(0,0,0,0.06); }
.chip-author { color: #b07020; }
.chip-author.active { color: #8a5a10; background: rgba(176,112,32,0.1); }
.chip-divider { width: 1px; height: 20px; background: rgba(0,0,0,0.08); margin: 0 4px; align-self: center; flex-shrink: 0; }

/* ── Stats ── */
.stats { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.stat {
  background: var(--card); backdrop-filter: blur(12px);
  border: 1px solid var(--border); border-radius: 14px;
  padding: 16px 20px; min-width: 100px; flex: 1;
}
.stat-value { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; }
.stat-label { font-size: 11px; color: var(--text3); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }

/* ── Card grid ── */
.grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; margin-top: 18px; align-items: start;
}
.card {
  background: var(--card); backdrop-filter: blur(12px);
  border: 1px solid var(--border); border-radius: 16px;
  padding: 20px; transition: all 0.2s; cursor: pointer; position: relative;
  display: flex; flex-direction: column; gap: 10px;
}
.card:hover { background: var(--card-hover); box-shadow: 0 2px 20px rgba(0,0,0,0.04); }
.card-top { display: flex; align-items: flex-start; gap: 12px; }
.card-icon {
  width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.card-info { flex: 1; min-width: 0; }
.card-name { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
.card-cmd { font-size: 11px; color: var(--accent); font-family: 'SF Mono', monospace; font-weight: 500; margin-top: 1px; }
.card-desc { font-size: 13px; color: #888; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: 10px; font-weight: 500; padding: 3px 8px; border-radius: 5px; background: rgba(0,0,0,0.04); color: var(--text3); }
.tag-type { background: var(--accent-light); color: var(--accent); }
.tag-platform { background: var(--green-light); color: var(--green); }
.tag-integration { background: var(--purple-light); color: var(--purple); }
.card-meta { font-size: 11px; color: #bbb; font-family: 'SF Mono', 'Fira Code', monospace; }
.card-schedule {
  position: absolute; top: 12px; right: 12px;
  font-size: 10px; font-weight: 600; color: var(--green);
  background: var(--green-light); padding: 3px 8px; border-radius: 5px;
}
.card-detail { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.06); font-size: 12px; color: #777; line-height: 1.7; }
.card.expanded .card-detail { display: block; }
.card.expanded .card-desc { -webkit-line-clamp: unset; }
.detail-editable { align-items: center; }
.author-input {
  padding: 5px 10px; border: 1px solid rgba(0,0,0,0.08); border-radius: 7px;
  font-size: 12px; font-family: inherit; color: var(--text1); background: rgba(0,0,0,0.02);
  outline: none; width: 160px; transition: border-color 0.15s;
}
.author-input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 2px rgba(108,92,231,0.1); }
.wf-author-edit {
  display: flex; align-items: center; gap: 10px;
  margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(0,0,0,0.06);
  font-size: 12px;
}
.detail-row { display: flex; gap: 8px; margin-bottom: 6px; }
.detail-label { color: var(--text3); min-width: 48px; flex-shrink: 0; }
.detail-value { color: var(--text2); }

/* ── Workflow ── */
.workflow-list { margin-top: 18px; display: flex; flex-direction: column; gap: 12px; }
.wf-card {
  background: var(--card); backdrop-filter: blur(12px);
  border: 1px solid var(--border); border-radius: 16px;
  overflow: hidden; transition: all 0.2s;
}
.wf-card:hover { box-shadow: 0 2px 20px rgba(0,0,0,0.04); }
.wf-header {
  padding: 18px 24px; cursor: pointer; display: flex; align-items: center; gap: 14px;
}
.wf-team {
  font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 6px;
  background: var(--accent-light); color: var(--accent); white-space: nowrap;
}
.wf-title { font-size: 17px; font-weight: 700; flex: 1; letter-spacing: -0.02em; }
.wf-meta { font-size: 12px; color: var(--text3); display: flex; gap: 12px; align-items: center; }
.wf-meta span { display: flex; align-items: center; gap: 3px; }
.wf-author { font-size: 11px; color: var(--text3); }
.wf-chevron { font-size: 20px; color: #ccc; transition: transform 0.2s; }
.wf-card.open .wf-chevron { transform: rotate(90deg); }
.wf-body { display: none; padding: 0 24px 24px; }
.wf-card.open .wf-body { display: block; }
.wf-desc { font-size: 13px; color: #888; margin-bottom: 20px; line-height: 1.5; }

/* Pipeline */
.pipeline { display: flex; flex-direction: column; gap: 0; }
.pipe-step { display: flex; align-items: stretch; gap: 0; position: relative; min-height: 68px; }
.pipe-line { width: 44px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
.pipe-dot {
  width: 18px; height: 18px; border-radius: 50%; border: 3px solid;
  z-index: 1; margin-top: 14px; flex-shrink: 0;
}
.pipe-dot.agent { border-color: var(--agent-color); background: rgba(108,92,231,0.15); }
.pipe-dot.human { border-color: var(--human-color); background: rgba(253,203,110,0.2); }
.pipe-dot.trigger { border-color: var(--trigger-color); background: rgba(178,190,195,0.15); }
.pipe-connector { flex: 1; width: 2px; background: #ddd; margin-top: 4px; }
.pipe-step:last-child .pipe-connector { display: none; }
.pipe-content { flex: 1; padding: 8px 0 8px 10px; min-width: 0; }
.pipe-content-inner {
  background: rgba(255,255,255,0.5); border-radius: 10px; padding: 12px 16px;
}
.pipe-content-inner.gap { background: rgba(214,48,49,0.06); }
.pipe-name { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pipe-badge { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; }
.pipe-badge.agent { background: var(--accent-light); color: var(--accent); }
.pipe-badge.human { background: rgba(253,203,110,0.2); color: #e17055; }
.pipe-badge.trigger { background: rgba(0,0,0,0.04); color: var(--text3); }
.pipe-badge.gap { background: var(--red-light); color: var(--red); }
.pipe-desc { font-size: 12px; color: #888; margin-top: 4px; line-height: 1.5; }
.pipe-tools { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 6px; }
.pipe-tool { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,0.04); color: var(--text3); }
.pipe-output { font-size: 11px; color: var(--green); margin-top: 4px; font-weight: 500; }
.pipe-who { font-size: 11px; color: #e17055; font-weight: 500; }
.pipe-reject { font-size: 10px; color: var(--red); margin-top: 4px; }
.pipe-parallel {
  margin-top: 12px; margin-left: 44px;
  background: rgba(253,203,110,0.08); border: 1px dashed #fdcb6e; border-radius: 10px;
  padding: 12px 16px;
}
.pipe-parallel-label { font-size: 10px; font-weight: 700; color: var(--orange); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.wf-legend { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text2); }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid; }
.legend-dot.agent { border-color: var(--agent-color); background: rgba(108,92,231,0.15); }
.legend-dot.human { border-color: var(--human-color); background: rgba(253,203,110,0.2); }
.legend-dot.trigger { border-color: var(--trigger-color); background: rgba(178,190,195,0.15); }

/* ── Guide banner ── */
.guide-banner {
  background: var(--card); backdrop-filter: blur(12px);
  border: 1px solid var(--border); border-radius: 16px;
  padding: 24px; margin-top: 18px;
  display: flex; align-items: flex-start; gap: 16px;
}
.guide-icon {
  width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
  background: var(--accent-light); color: var(--accent);
  display: flex; align-items: center; justify-content: center; font-size: 20px;
}
.guide-body { flex: 1; }
.guide-body h3 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.guide-body p { font-size: 13px; color: #888; line-height: 1.6; margin-bottom: 12px; }
.guide-steps { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.guide-step {
  display: flex; align-items: flex-start; gap: 10px; font-size: 12px; color: var(--text2);
}
.guide-step-num {
  width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
  background: var(--accent-light); color: var(--accent);
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.guide-step code { background: rgba(0,0,0,0.05); padding: 1px 6px; border-radius: 4px; font-size: 11px; }
.guide-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.guide-actions .btn { font-size: 12px; padding: 7px 14px; }

.no-results { text-align: center; padding: 60px 0; color: #aaa; font-size: 13px; grid-column: 1/-1; }

/* ── Modal ── */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
  align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #fff; border-radius: 18px; padding: 32px;
  width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.modal h2 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
.modal .subtitle { font-size: 13px; color: var(--text3); margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 5px; }
.form-group label .req { color: var(--red); }
.form-group input, .form-group textarea, .form-group select {
  width: 100%; padding: 10px 12px; border: 1px solid rgba(0,0,0,0.08);
  border-radius: 10px; font-size: 13px; color: var(--text1);
  font-family: inherit; outline: none; background: #f8f8fa;
}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,92,231,0.1);
}
.form-group textarea { resize: vertical; min-height: 60px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; }
.output-box {
  background: #f8f8fa; border: 1px solid rgba(0,0,0,0.06); border-radius: 10px;
  padding: 14px; font-family: 'SF Mono', monospace; font-size: 12px;
  white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto;
  line-height: 1.6; color: var(--text2); margin: 16px 0;
}
.output-actions { display: flex; gap: 8px; }
.output-actions .btn { font-size: 12px; padding: 8px 14px; }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: var(--text1); color: #fff; padding: 10px 20px; border-radius: 10px;
  font-size: 13px; font-weight: 500; transition: transform 0.3s; z-index: 200;
}
.toast.show { transform: translateX(-50%) translateY(0); }

@media (max-width: 768px) {
  .hero h1 { font-size: 1.6rem; }
  .grid { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr; }
  .top-bar { flex-direction: column; }
  .wf-meta { display: none; }
  .guide-banner { flex-direction: column; }
}
</style>
</head>
<body>

<div class="page">
  <!-- Header -->
  <div class="site-header">
    <div class="site-header-left">
      <img src="favicon.png" alt="">
      <div>
        <h1>Routinery Skill Registry</h1>
        <p>팀이 만든 에이전트, 스킬, 자동화 워크플로우를 한눈에</p>
      </div>
    </div>
  </div>

  <!-- Top bar -->
  <div class="top-bar">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search" placeholder="검색 -- 이름, 설명, 도구, 만든 사람..." oninput="renderContent()">
    </div>
    <button class="btn" onclick="exportJSON()">JSON 내보내기</button>
    <button class="btn btn-primary" onclick="openForm()">+ 등록하기</button>
  </div>

  <!-- Tabs -->
  <div class="main-tabs" id="mainTabs"></div>

  <!-- Sub-filters -->
  <div class="sub-filters" id="subFilters"></div>

  <!-- Content -->
  <div id="content"></div>
</div>

<!-- Register Modal -->
<div class="modal-overlay" id="formModal">
  <div class="modal">
    <h2>새 스킬/에이전트 등록</h2>
    <p class="subtitle">등록 후 JSON을 복사하여 <code>data/registry.json</code>에 추가하세요.</p>
    <div class="form-row">
      <div class="form-group"><label>이름 <span class="req">*</span></label><input type="text" id="f-name" placeholder="예: 떡밥제조기"></div>
      <div class="form-group"><label>호출 커맨드</label><input type="text" id="f-command" placeholder="예: /pm"></div>
    </div>
    <div class="form-group"><label>한줄 설명 <span class="req">*</span></label><textarea id="f-desc" rows="2" placeholder="뭘 하는 건지 한두 문장으로"></textarea></div>
    <div class="form-row">
      <div class="form-group"><label>카테고리 <span class="req">*</span></label><select id="f-category"><option value="">선택</option><option>기획</option><option>디자인</option><option>개발</option><option>QA</option><option>릴리즈</option><option>운영</option><option>지식관리</option><option>자동화</option></select></div>
      <div class="form-group"><label>타입 <span class="req">*</span></label><select id="f-type"><option value="">선택</option><option value="agent">에이전트</option><option value="skill">스킬</option><option value="automation">자동화</option><option value="mcp">MCP 연동</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>플랫폼</label><select id="f-platform"><option>Claude Code</option><option>Claude Desktop</option><option>Cursor</option><option>GPT</option><option>Hermes</option><option>기타</option></select></div>
      <div class="form-group"><label>실행 방식</label><select id="f-trigger"><option value="slash-command">슬래시 커맨드</option><option value="manual">수동 실행</option><option value="schedule">스케줄 자동</option><option value="event">이벤트 트리거</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>입력</label><input type="text" id="f-input" placeholder="뭘 넣나요?"></div>
      <div class="form-group"><label>출력</label><input type="text" id="f-output" placeholder="뭐가 나오나요?"></div>
    </div>
    <div class="form-group"><label>연동 도구</label><input type="text" id="f-integrations" placeholder="쉼표로 구분 -- Figma, Notion, Slack 등"></div>
    <div class="form-row">
      <div class="form-group"><label>아이콘 (이모지)</label><input type="text" id="f-icon" placeholder="예: 🐻" maxlength="4"></div>
      <div class="form-group"><label>만든 사람 <span class="req">*</span></label><input type="text" id="f-author" placeholder="본인 이름"></div>
    </div>
    <div class="form-group"><label>스케줄 (자동화인 경우)</label><input type="text" id="f-schedule" placeholder="예: 매일 21:00"></div>
    <div id="formOutput"></div>
    <div class="form-actions">
      <button class="btn" onclick="closeForm()">닫기</button>
      <button class="btn btn-primary" onclick="generateEntry()">JSON 생성</button>
    </div>

// LOAD
// ════════════════════════════════════════
async function loadData() {
  try {
    const [r1, r2] = await Promise.all([
      fetch('data/registry.json?t=' + Date.now()),
      fetch('data/workflows.json?t=' + Date.now()),
    ]);
    if (!r1.ok || !r2.ok) throw new Error('fetch');
    REGISTRY = await r1.json();
    WORKFLOWS = await r2.json();
  } catch (e) {
    REGISTRY = EMBEDDED_REGISTRY;
    WORKFLOWS = EMBEDDED_WORKFLOWS;
  }
  renderAll();
}

// ════════════════════════════════════════
// RENDER
// ════════════════════════════════════════
function renderAll() {
  renderMainTabs();
  renderSubFilters();
  renderContent();
}

function renderMainTabs() {
  const gapCount = WORKFLOWS.reduce((n, w) => n + w.steps.filter(s => s.gap).length, 0);
  document.getElementById('mainTabs').innerHTML = `
    <button class="main-tab${mainTab === 'workflows' ? ' active' : ''}" onclick="switchTab('workflows')">
      Workflows<span class="tab-count">${WORKFLOWS.length}</span>
      ${gapCount ? `<span class="tab-gap-count">${gapCount} gaps</span>` : ''}
    </button>
    <button class="main-tab${mainTab === 'registry' ? ' active' : ''}" onclick="switchTab('registry')">
      Registry<span class="tab-count">${REGISTRY.length}</span>
    </button>
  `;
}

function switchTab(tab) {
  mainTab = tab; currentFilter = 'All'; currentType = 'All'; currentAuthor = 'All';
  renderAll();
}

function getAllAuthors(source) {
  const raw = source.flatMap(d => (d.author || '').split(',').map(a => a.trim())).filter(Boolean);
  return [...new Set(raw)].sort();
}

function renderSubFilters() {
  const el = document.getElementById('subFilters');
  if (mainTab === 'workflows') {
    const dataTeams = [...new Set(WORKFLOWS.map(w => w.team))];
    const teams = [...new Set([...TEAMS, ...dataTeams])];
    const authors = getAllAuthors(WORKFLOWS);
    let h = `<button class="chip${currentFilter === 'All' ? ' active' : ''}" onclick="setFilter('All')">전체</button>`;
    teams.forEach(t => { h += `<button class="chip${currentFilter === t ? ' active' : ''}" onclick="setFilter('${t}')">${t}</button>`; });
    if (authors.length) {
      h += `<span class="chip-divider"></span>`;
      h += `<button class="chip chip-author${currentAuthor === 'All' ? ' active' : ''}" onclick="setAuthor('All')">전체 멤버</button>`;
      authors.forEach(a => { h += `<button class="chip chip-author${currentAuthor === a ? ' active' : ''}" onclick="setAuthor('${a}')">${a}</button>`; });
    }
    el.innerHTML = h;
  } else {
    const cats = [...new Set(REGISTRY.map(d => d.category))].sort();
    const types = [...new Set(REGISTRY.map(d => d.type))];
    const authors = getAllAuthors(REGISTRY);
    let h = `<button class="chip${currentFilter === 'All' ? ' active' : ''}" onclick="setFilter('All')">전체</button>`;
    cats.forEach(c => { h += `<button class="chip${currentFilter === c ? ' active' : ''}" onclick="setFilter('${c}')">${c}</button>`; });
    h += `<span class="chip-divider"></span>`;
    types.forEach(t => { h += `<button class="chip${currentType === t ? ' active' : ''}" onclick="setType('${t}')">${TYPE_LABELS[t]||t}</button>`; });
    if (authors.length) {
      h += `<span class="chip-divider"></span>`;
      h += `<button class="chip chip-author${currentAuthor === 'All' ? ' active' : ''}" onclick="setAuthor('All')">전체 멤버</button>`;
      authors.forEach(a => { h += `<button class="chip chip-author${currentAuthor === a ? ' active' : ''}" onclick="setAuthor('${a}')">${a}</button>`; });
    }
    el.innerHTML = h;
  }
}

function setFilter(f) { currentFilter = f; renderSubFilters(); renderContent(); }
function setType(t) { currentType = currentType === t ? 'All' : t; renderSubFilters(); renderContent(); }
function setAuthor(a) { currentAuthor = a; renderSubFilters(); renderContent(); }

function matchesAuthor(itemAuthor) {
  if (currentAuthor === 'All') return true;
  return (itemAuthor || '').split(',').map(a => a.trim()).includes(currentAuthor);
}
function renderContent() { mainTab === 'workflows' ? renderWorkflows() : renderRegistry(); }

// ════════════════════════════════════════
// WORKFLOWS
// ════════════════════════════════════════
function renderWorkflows() {
  const q = document.getElementById('search').value.toLowerCase();
  let items = WORKFLOWS;
  if (currentFilter !== 'All') items = items.filter(w => w.team === currentFilter);
  if (currentAuthor !== 'All') items = items.filter(w => matchesAuthor(w.author));
  if (q) items = items.filter(w => w.name.toLowerCase().includes(q) || w.description.toLowerCase().includes(q) || w.team.toLowerCase().includes(q));

  let html = items.map(wfCardHTML).join('');
  html += guideHTML();
  document.getElementById('content').innerHTML = html;
}

function toggleWf(el) { el.closest('.wf-card').classList.toggle('open'); }

function wfCardHTML(wf) {
  const ac = wf.steps.filter(s => s.type === 'agent').length + (wf.parallel || []).length;
  const hc = wf.steps.filter(s => s.type === 'human').length;
  const gc = wf.steps.filter(s => s.gap).length;

  let stepsHtml = wf.steps.map(stepHTML).join('');
  if (wf.parallel) stepsHtml += wf.parallel.map(p => `
    <div class="pipe-parallel">
      <div class="pipe-parallel-label">${p.label || '병렬 트랙'}</div>
      <div class="pipe-name"><span>${p.name}</span><span class="pipe-badge agent">에이전트</span></div>
      <div class="pipe-desc">${p.description}</div>
      ${p.tools?.length ? `<div class="pipe-tools">${p.tools.map(t=>`<span class="pipe-tool">${t}</span>`).join('')}</div>` : ''}
      ${p.output ? `<div class="pipe-output">\u2192 ${p.output}</div>` : ''}
    </div>`).join('');

  return `<div class="wf-card${wf.steps.length <= 5 ? ' open' : ''}">
    <div class="wf-header" onclick="toggleWf(this)">
      <span class="wf-team">${wf.team}</span>
      <span class="wf-title">${wf.name}</span>
      <div class="wf-meta">
        <span class="wf-author">by ${wf.author || '미지정'}</span>
        <span style="color:var(--agent-color)">\u{1F916} ${ac}</span>
        <span style="color:#e17055">\u{1F464} ${hc}</span>
        ${gc ? `<span style="color:var(--red)">\u26A0 ${gc} gap</span>` : ''}
      </div>
      <span class="wf-chevron">\u203A</span>
    </div>
    <div class="wf-body">
      <div class="wf-desc">${wf.description}</div>
      <div class="wf-legend">
        <div class="legend-item"><div class="legend-dot agent"></div>에이전트</div>
        <div class="legend-item"><div class="legend-dot human"></div>사람 (게이트)</div>
        <div class="legend-item"><div class="legend-dot trigger"></div>트리거</div>
      </div>
      <div class="pipeline">${stepsHtml}</div>
      <div class="wf-author-edit">
        <span class="detail-label">담당자</span>
        <input class="author-input" value="${wf.author||''}" placeholder="이름 입력"
          onclick="event.stopPropagation()"
          onchange="updateWfAuthor('${wf.id}', this.value)" />
      </div>
    </div>
  </div>`;
}

function stepHTML(s) {
  const t = s.type;
  const label = t === 'agent' ? '에이전트' : t === 'human' ? '사람' : '트리거';
  const tools = (s.tools || []).map(t => `<span class="pipe-tool">${t}</span>`).join('');
  return `<div class="pipe-step">
    <div class="pipe-line"><div class="pipe-dot ${t}"></div><div class="pipe-connector"></div></div>
    <div class="pipe-content">
      <div class="pipe-content-inner ${t}${s.gap ? ' gap' : ''}">
        <div class="pipe-name">
          <span>${s.name}</span>
          <span class="pipe-badge ${t}">${label}</span>
          ${s.gap ? '<span class="pipe-badge gap">GAP - 미수집</span>' : ''}
          ${s.who ? `<span class="pipe-who">${s.who}</span>` : ''}
        </div>
        <div class="pipe-desc">${s.description}</div>
        ${tools ? `<div class="pipe-tools">${tools}</div>` : ''}
        ${s.output ? `<div class="pipe-output">\u2192 ${s.output}</div>` : ''}
        ${s.rejectTo ? `<div class="pipe-reject">\u21A9 REJECTED \u2192 ${s.rejectTo}</div>` : ''}
        ${s.exitCondition ? `<div class="pipe-reject" style="color:var(--orange)">\u2197 ${s.exitCondition}</div>` : ''}
      </div>
    </div>
  </div>`;
}

// ════════════════════════════════════════
// GUIDE
// ════════════════════════════════════════
function guideHTML() {
  return `<div class="guide-banner">
    <div class="guide-icon">\u{1F4D6}</div>
    <div class="guide-body">
      <h3>워크플로우 또는 에이전트 추가하기</h3>
      <p>팀에서 사용하는 에이전트, 스킬, 자동화를 이 대시보드에 등록할 수 있습니다.<br>
      두 가지 방법이 있습니다.</p>
      <div class="guide-steps">
        <div class="guide-step">
          <div class="guide-step-num">1</div>
          <div><strong>UI로 등록</strong> \u2014 오른쪽 위 <strong>+ 등록하기</strong> 버튼을 누르면 폼이 열립니다. 정보를 입력하면 JSON이 생성됩니다.</div>
        </div>
        <div class="guide-step">
          <div class="guide-step-num">2</div>
          <div><strong>JSON 직접 편집</strong> \u2014 GitHub에서 <code>data/registry.json</code> (개별 에이전트) 또는 <code>data/workflows.json</code> (파이프라인)에 항목을 추가하고 PR을 올립니다. 머지되면 자동 반영.</div>
        </div>
        <div class="guide-step">
          <div class="guide-step-num">3</div>
          <div><strong>Claude Code로 업데이트</strong> \u2014 <code>~/skill-dashboard</code>에서 Claude Code를 실행하고 "대시보드 업데이트해줘"라고 말하면 스킬/프로젝트를 스캔하여 동기화합니다.</div>
        </div>
      </div>
      <div class="guide-actions">
        <a class="btn" href="https://github.com/Routinery/skill-dashboard" target="_blank">GitHub 저장소</a>
        <a class="btn" href="https://app.notion.com/p/routinery/Routinery-667a9e216c774316b024301b9cca66a3" target="_blank">Notion 홈</a>
        <button class="btn btn-primary" onclick="openForm()">+ 등록하기</button>
      </div>
    </div>
  </div>`;
}

// ════════════════════════════════════════
// REGISTRY
// ════════════════════════════════════════
function renderRegistry() {
  const q = document.getElementById('search').value.toLowerCase();
  let items = REGISTRY;
  if (currentFilter !== 'All') items = items.filter(d => d.category === currentFilter);
  if (currentType !== 'All') items = items.filter(d => d.type === currentType);
  if (currentAuthor !== 'All') items = items.filter(d => matchesAuthor(d.author));
  if (q) items = items.filter(d =>
    d.name.toLowerCase().includes(q) || d.description.toLowerCase().includes(q) ||
    (d.command || '').toLowerCase().includes(q) || (d.author || '').toLowerCase().includes(q) ||
    (d.integrations || []).some(i => i.toLowerCase().includes(q))
  );

  const types = {}; REGISTRY.forEach(d => { types[d.type] = (types[d.type] || 0) + 1; });
  const authors = new Set(REGISTRY.map(d => d.author).filter(Boolean));

  let html = `<div class="stats">
    <div class="stat"><div class="stat-value">${REGISTRY.length}</div><div class="stat-label">전체 등록</div></div>
    <div class="stat"><div class="stat-value">${types.agent || 0}</div><div class="stat-label">에이전트</div></div>
    <div class="stat"><div class="stat-value">${types.skill || 0}</div><div class="stat-label">스킬</div></div>
    <div class="stat"><div class="stat-value">${types.automation || 0}</div><div class="stat-label">자동화</div></div>
    <div class="stat"><div class="stat-value">${authors.size}</div><div class="stat-label">기여자</div></div>
  </div>`;

  if (!items.length) {
    html += `<div class="no-results" style="padding:60px 0">검색 결과가 없습니다.</div>`;
  } else {
    html += `<div class="grid">${items.map(cardHTML).join('')}</div>`;
  }
  html += guideHTML();
  document.getElementById('content').innerHTML = html;
}

function cardHTML(d, idx) {
  const c = CAT_COLORS[d.category] || { bg:'rgba(0,0,0,0.04)', fg:'var(--text2)' };
  const ints = (d.integrations||[]).map(i=>`<span class="tag tag-integration">${i}</span>`).join('');
  const sched = d.schedule ? `<div class="card-schedule">\u26A1 ${d.schedule}</div>` : '';
  const authorDisplay = d.author || '미지정';
  return `<div class="card" onclick="toggleCard(this, event)">
    ${sched}
    <div class="card-top">
      <div class="card-icon" style="background:${c.bg};color:${c.fg}">${d.icon||'\u{1F527}'}</div>
      <div class="card-info">
        <div class="card-name">${d.name}</div>
        ${d.command?`<div class="card-cmd">${d.command}</div>`:''}
      </div>
    </div>
    <div class="card-desc">${d.description}</div>
    <div class="card-tags">
      <span class="tag tag-type">${TYPE_LABELS[d.type]||d.type}</span>
      <span class="tag tag-platform">${d.platform}</span>
      ${ints}
    </div>
    <div class="card-meta">by ${authorDisplay}</div>
    <div class="card-detail">
      ${d.input?`<div class="detail-row"><span class="detail-label">입력</span><span class="detail-value">${d.input}</span></div>`:''}
      ${d.output?`<div class="detail-row"><span class="detail-label">출력</span><span class="detail-value">${d.output}</span></div>`:''}
      ${d.trigger?`<div class="detail-row"><span class="detail-label">실행</span><span class="detail-value">${d.trigger}</span></div>`:''}
      <div class="detail-row detail-editable">
        <span class="detail-label">담당자</span>
        <input class="author-input" value="${d.author||''}" placeholder="이름 입력"
          onclick="event.stopPropagation()"
          onchange="updateAuthor('${d.id}', this.value)" />
      </div>
    </div>
  </div>`;
}

function toggleCard(el, e) {
  if (e.target.closest('.author-input')) return;
  el.classList.toggle('expanded');
}

function updateAuthor(id, value) {
  const item = REGISTRY.find(d => d.id === id);
  if (item) {
    item.author = value.trim();
    showToast(value.trim() ? '담당자: ' + value.trim() : '담당자 해제됨');
    renderSubFilters();
  }
}

function updateWfAuthor(id, value) {
  const wf = WORKFLOWS.find(w => w.id === id);
  if (wf) {
    wf.author = value.trim();
    showToast(value.trim() ? '담당자: ' + value.trim() : '담당자 해제됨');
    renderSubFilters();
    // Re-render just the header author text
    const card = document.querySelector(`.wf-card .wf-header .wf-author`);
    // Full re-render for simplicity since author filters may change
    renderContent();
  }
}

// ════════════════════════════════════════
// FORM
// ════════════════════════════════════════
function openForm() { document.getElementById('formModal').classList.add('show'); document.getElementById('formOutput').innerHTML = ''; }
function closeForm() { document.getElementById('formModal').classList.remove('show'); }
document.getElementById('formModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeForm(); });

function generateEntry() {
  const name = document.getElementById('f-name').value.trim();
  const desc = document.getElementById('f-desc').value.trim();
  const cat = document.getElementById('f-category').value;
  const type = document.getElementById('f-type').value;
  const author = document.getElementById('f-author').value.trim();
  if (!name||!desc||!cat||!type||!author) { alert('필수 항목(*)을 모두 입력해주세요.'); return; }
  const id = (document.getElementById('f-command').value||name).replace(/^\//,'').replace(/\s+/g,'-').toLowerCase();
  const entry = { id, name,
    command: document.getElementById('f-command').value.trim()||undefined,
    description: desc, category: cat, type,
    platform: document.getElementById('f-platform').value,
    trigger: document.getElementById('f-trigger').value,
    input: document.getElementById('f-input').value.trim()||undefined,
    output: document.getElementById('f-output').value.trim()||undefined,
    integrations: document.getElementById('f-integrations').value.split(',').map(s=>s.trim()).filter(Boolean),
    icon: document.getElementById('f-icon').value.trim()||undefined,
    author,
    schedule: document.getElementById('f-schedule').value.trim()||undefined,
    updatedAt: new Date().toISOString().split('T')[0],
  };
  Object.keys(entry).forEach(k => entry[k] === undefined && delete entry[k]);
  const json = JSON.stringify(entry, null, 2);
  document.getElementById('formOutput').innerHTML = `
    <div style="margin-top:16px;padding-top:16px;border-top:1px solid rgba(0,0,0,0.06)">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px;">생성된 JSON</div>
      <div class="output-box">${esc(json)}</div>
      <div class="output-actions">
        <button class="btn" onclick="copyText(\`${json.replace(/`/g,'\\`')}\`)">JSON 복사</button>
        <button class="btn btn-primary" onclick='addLocal(${escA(json)})'>바로 추가</button>
      </div>
      <p style="font-size:11px;color:var(--text3);margin-top:10px;">영구 반영: <code>data/registry.json</code>에 추가 후 push</p>
    </div>`;
}
function addLocal(e) { if(typeof e==='string')e=JSON.parse(e); REGISTRY.push(e); closeForm(); renderAll(); showToast('추가됨 (이 세션만)'); }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escA(s) { return s.replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }
function exportJSON() {
  const b = new Blob([JSON.stringify({registry:REGISTRY,workflows:WORKFLOWS},null,2)],{type:'application/json'});
  const u = URL.createObjectURL(b);
  const a = document.createElement('a'); a.href=u; a.download='skill-dashboard-export.json'; a.click();
  URL.revokeObjectURL(u);
}
function copyText(t) { navigator.clipboard.writeText(t); showToast('복사되었습니다'); }
function showToast(m) { const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

loadData();
</script>
</body>
</html>
