<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Routinery Skill Registry</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fff;--surface:#f7f7f8;--border:#eee;
  --text:#111;--text2:#666;--text3:#aaa;
  --accent:#6c5ce7;--accent-bg:rgba(108,92,231,0.07);
  --green:#00a67e;--green-bg:rgba(0,166,126,0.07);
  --orange:#e17055;--orange-bg:rgba(225,112,85,0.07);
  --red:#d63031;--red-bg:rgba(214,48,49,0.07);
  --blue:#0984e3;--blue-bg:rgba(9,132,227,0.07);
  --pink:#e84393;--pink-bg:rgba(232,67,147,0.07);
  --yellow:#fdcb6e;--yellow-bg:rgba(253,203,110,0.15);
  --gray:#b2bec3;--gray-bg:rgba(178,190,195,0.12);
}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

/* Layout */
.page{max-width:960px;margin:0 auto;padding:40px 32px 100px}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:32px}
.logo{display:flex;align-items:center;gap:12px}
.logo img{width:32px;height:32px;border-radius:8px}
.logo h1{font-size:18px;font-weight:700;letter-spacing:-0.02em}
.header-actions{display:flex;gap:8px}

/* Buttons */
.btn{
  height:34px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:500;
  border:1px solid var(--border);background:#fff;color:var(--text);
  cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
}
.btn:hover{background:var(--surface)}
.btn-primary{background:var(--text);color:#fff;border-color:var(--text)}
.btn-primary:hover{background:#333}

/* Search */
.search{
  width:100%;height:38px;padding:0 14px 0 36px;
  border:1px solid var(--border);border-radius:8px;background:var(--surface);
  font-size:13px;color:var(--text);outline:none;margin-bottom:20px;
}
.search:focus{border-color:var(--accent);background:#fff}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3)}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{
  padding:10px 16px;font-size:14px;font-weight:500;color:var(--text3);
  background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--text);border-bottom-color:var(--text)}
.tab-badge{font-size:11px;color:var(--text3);background:var(--surface);padding:1px 6px;border-radius:4px;margin-left:6px}

/* Filters */
.filters{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:20px}
.filter{
  height:30px;padding:0 12px;border-radius:6px;border:none;
  background:transparent;color:var(--text3);font-size:12px;font-weight:500;cursor:pointer;
}
.filter:hover{color:var(--text2);background:var(--surface)}
.filter.active{color:var(--text);background:var(--surface)}
.filter-sep{width:1px;height:16px;background:var(--border);align-self:center;margin:0 4px}
.filter.author{color:#9a6e30}
.filter.author.active{background:rgba(154,110,48,0.08)}

/* Stats row */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px}
.stat{background:#fff;padding:16px;text-align:center}
.stat-val{font-size:24px;font-weight:700;letter-spacing:-0.03em}
.stat-label{font-size:11px;color:var(--text3);margin-top:2px;text-transform:uppercase;letter-spacing:0.03em;font-weight:500}

/* Registry cards */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:24px}
.card{background:#fff;padding:20px;cursor:pointer;transition:background 0.1s}
.card:hover{background:#fafbfc}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.card-emoji{font-size:20px;line-height:1}
.card-name{font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-cmd{font-size:11px;color:var(--accent);font-family:'SF Mono',monospace;font-weight:500}
.card-desc{font-size:12px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px}
.card-tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;background:var(--surface);color:var(--text3)}
.tag-type{background:var(--accent-bg);color:var(--accent)}
.tag-platform{background:var(--green-bg);color:var(--green)}
.tag-int{background:var(--blue-bg);color:var(--blue)}
.card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;color:var(--text3)}
.card-schedule{font-size:10px;font-weight:600;color:var(--green);background:var(--green-bg);padding:2px 6px;border-radius:4px}
.card-detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--text2);line-height:1.7}
.card.expanded .card-detail{display:block}
.card.expanded .card-desc{-webkit-line-clamp:unset}
.detail-row{display:flex;gap:8px;margin-bottom:4px}
.detail-label{color:var(--text3);min-width:44px;flex-shrink:0}
.author-input{
  padding:4px 8px;border:1px solid var(--border);border-radius:6px;
  font-size:12px;font-family:inherit;color:var(--text);background:var(--surface);
  outline:none;width:140px;
}
.author-input:focus{border-color:var(--accent);background:#fff}

/* Workflows */
.wf-list{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.wf-card{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}
.wf-head{padding:16px 20px;cursor:pointer;display:flex;align-items:center;gap:12px}
.wf-team{font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;background:var(--accent-bg);color:var(--accent);white-space:nowrap}
.wf-title{font-size:15px;font-weight:600;flex:1;letter-spacing:-0.01em}
.wf-info{font-size:12px;color:var(--text3);display:flex;gap:10px;align-items:center}
.wf-info span{display:flex;align-items:center;gap:3px}
.wf-chevron{color:var(--text3);transition:transform 0.15s;font-size:16px}
.wf-card.open .wf-chevron{transform:rotate(90deg)}
.wf-body{display:none;padding:0 20px 20px}
.wf-card.open .wf-body{display:block}
.wf-desc{font-size:12px;color:var(--text2);margin-bottom:16px;line-height:1.5}

/* Pipeline */
.pipeline{display:flex;flex-direction:column}
.pipe-step{display:flex;align-items:stretch;min-height:56px}
.pipe-rail{width:36px;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
.pipe-dot{width:14px;height:14px;border-radius:50%;border:2.5px solid;margin-top:12px;flex-shrink:0}
.pipe-dot.agent{border-color:var(--accent);background:var(--accent-bg)}
.pipe-dot.human{border-color:var(--yellow);background:var(--yellow-bg)}
.pipe-dot.trigger{border-color:var(--gray);background:var(--gray-bg)}
.pipe-line{flex:1;width:2px;background:var(--border);margin-top:4px}
.pipe-step:last-child .pipe-line{display:none}
.pipe-body{flex:1;padding:6px 0 6px 8px}
.pipe-inner{background:var(--surface);border-radius:8px;padding:10px 14px}
.pipe-inner.gap{background:var(--red-bg)}
.pipe-label{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pipe-badge{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px}
.pipe-badge.agent{background:var(--accent-bg);color:var(--accent)}
.pipe-badge.human{background:var(--yellow-bg);color:var(--orange)}
.pipe-badge.trigger{background:var(--surface);color:var(--text3)}
.pipe-badge.gap{background:var(--red-bg);color:var(--red)}
.pipe-who{font-size:11px;color:var(--orange);font-weight:500}
.pipe-desc{font-size:11px;color:var(--text2);margin-top:3px;line-height:1.4}
.pipe-tools{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.pipe-tool{font-size:10px;padding:1px 5px;border-radius:3px;background:rgba(0,0,0,0.04);color:var(--text3)}
.pipe-output{font-size:11px;color:var(--green);margin-top:3px;font-weight:500}
.pipe-reject{font-size:10px;color:var(--red);margin-top:3px}
.pipe-parallel{margin-top:10px;margin-left:36px;background:var(--yellow-bg);border:1px dashed var(--yellow);border-radius:8px;padding:10px 14px}
.pipe-parallel-tag{font-size:10px;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px}

.wf-legend{display:flex;gap:14px;margin-bottom:14px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.legend-dot{width:8px;height:8px;border-radius:50%;border:2px solid}
.legend-dot.agent{border-color:var(--accent);background:var(--accent-bg)}
.legend-dot.human{border-color:var(--yellow);background:var(--yellow-bg)}
.legend-dot.trigger{border-color:var(--gray);background:var(--gray-bg)}

.wf-author-edit{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:12px}

/* Guide */
.guide{border:1px solid var(--border);border-radius:10px;padding:20px 24px;margin-top:24px;background:var(--surface)}
.guide h3{font-size:14px;font-weight:600;margin-bottom:8px}
.guide p{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:12px}
.guide-steps{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.guide-step{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text2)}
.guide-num{width:18px;height:18px;border-radius:50%;background:var(--accent-bg);color:var(--accent);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.guide-step code{background:rgba(0,0,0,0.05);padding:1px 5px;border-radius:3px;font-size:11px}
.guide-actions{display:flex;gap:8px;flex-wrap:wrap}
.guide-actions .btn{height:30px;font-size:12px}

.empty{text-align:center;padding:48px 0;color:var(--text3);font-size:13px;grid-column:1/-1}

/* Modal */
.overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.3);align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;padding:28px;width:90%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,0.12)}
.modal h2{font-size:18px;font-weight:700;margin-bottom:3px}
.modal .sub{font-size:12px;color:var(--text3);margin-bottom:20px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px}
.fg .req{color:var(--red)}
.fg input,.fg textarea,.fg select{
  width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;
  font-size:13px;color:var(--text);font-family:inherit;outline:none;background:var(--surface);
}
.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:var(--accent);background:#fff}
.fg textarea{resize:vertical;min-height:56px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.factions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.output-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:'SF Mono',monospace;font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow-y:auto;line-height:1.5;color:var(--text2);margin:14px 0}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:8px 18px;border-radius:8px;font-size:13px;font-weight:500;transition:transform 0.25s;z-index:200}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:768px){
  .grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(3,1fr)}
  .frow{grid-template-columns:1fr}
  .wf-info{display:none}
  .header-actions .btn:not(.btn-primary){display:none}
  .guide{flex-direction:column}
}
</style>
</head>
<body>

<div class="page">
  <header>
    <div class="logo">
      <img src="logo.png" alt="">
      <h1>Skill Registry</h1>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="exportJSON()">Export</button>
      <button class="btn btn-primary" onclick="openForm()">+ 등록</button>
    </div>
  </header>

  <div class="search-wrap">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search" type="text" id="search" placeholder="검색..." oninput="renderContent()">
  </div>

  <div class="tabs" id="mainTabs"></div>
  <div class="filters" id="subFilters"></div>
  <div id="content"></div>
</div>

<div class="overlay" id="formModal">
  <div class="modal">
    <h2>새 스킬/에이전트 등록</h2>
    <p class="sub">등록 후 JSON을 복사하여 <code>data/registry.json</code>에 추가하세요.</p>
    <div class="frow">
      <div class="fg"><label>이름 <span class="req">*</span></label><input type="text" id="f-name" placeholder="예: 떡밥제조기"></div>
      <div class="fg"><label>호출 커맨드</label><input type="text" id="f-command" placeholder="예: /pm"></div>
    </div>
    <div class="fg"><label>한줄 설명 <span class="req">*</span></label><textarea id="f-desc" rows="2" placeholder="뭘 하는 건지 한두 문장으로"></textarea></div>
    <div class="frow">
      <div class="fg"><label>카테고리 <span class="req">*</span></label><select id="f-category"><option value="">선택</option><option>기획</option><option>디자인</option><option>개발</option><option>QA</option><option>릴리즈</option><option>운영</option><option>지식관리</option><option>자동화</option></select></div>
      <div class="fg"><label>타입 <span class="req">*</span></label><select id="f-type"><option value="">선택</option><option value="agent">에이전트</option><option value="skill">스킬</option><option value="automation">자동화</option><option value="mcp">MCP 연동</option></select></div>
    </div>
    <div class="frow">
      <div class="fg"><label>플랫폼</label><select id="f-platform"><option>Claude Code</option><option>Claude Desktop</option><option>Cursor</option><option>GPT</option><option>Hermes</option><option>기타</option></select></div>
      <div class="fg"><label>실행 방식</label><select id="f-trigger"><option value="slash-command">슬래시 커맨드</option><option value="manual">수동 실행</option><option value="schedule">스케줄 자동</option><option value="event">이벤트 트리거</option></select></div>
    </div>
    <div class="frow">
      <div class="fg"><label>입력</label><input type="text" id="f-input" placeholder="뭘 넣나요?"></div>
      <div class="fg"><label>출력</label><input type="text" id="f-output" placeholder="뭐가 나오나요?"></div>
    </div>
    <div class="fg"><label>연동 도구</label><input type="text" id="f-integrations" placeholder="쉼표로 구분 - Figma, Notion, Slack 등"></div>
    <div class="frow">
      <div class="fg"><label>아이콘 (이모지)</label><input type="text" id="f-icon" placeholder="🐻" maxlength="4"></div>
      <div class="fg"><label>만든 사람 <span class="req">*</span></label><input type="text" id="f-author" placeholder="본인 이름"></div>
    </div>
    <div class="fg"><label>스케줄 (자동화인 경우)</label><input type="text" id="f-schedule" placeholder="예: 매일 21:00"></div>
    <div id="formOutput"></div>
    <div class="factions">
      <button class="btn" onclick="closeForm()">닫기</button>
      <button class="btn btn-primary" onclick="generateEntry()">JSON 생성</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let REGISTRY=[], WORKFLOWS=[];
let mainTab='workflows', currentFilter='All', currentType='All', currentAuthor='All';

const TL={agent:'에이전트',skill:'스킬',automation:'자동화',mcp:'MCP 연동'};

async function loadData(){
  try{
    const[r1,r2]=await Promise.all([fetch('data/registry.json?t='+Date.now()),fetch('data/workflows.json?t='+Date.now())]);
    if(!r1.ok||!r2.ok)throw 0;
    REGISTRY=await r1.json();WORKFLOWS=await r2.json();
  }catch(e){REGISTRY=EMBEDDED_REGISTRY;WORKFLOWS=EMBEDDED_WORKFLOWS}
  renderAll();
}

function renderAll(){renderTabs();renderFilters();renderContent()}

function renderTabs(){
  const gc=WORKFLOWS.reduce((n,w)=>n+w.steps.filter(s=>s.gap).length,0);
  document.getElementById('mainTabs').innerHTML=`
    <button class="tab${mainTab==='workflows'?' active':''}" onclick="switchTab('workflows')">Workflows<span class="tab-badge">${WORKFLOWS.length}</span>${gc?`<span class="tab-badge" style="color:var(--red);background:var(--red-bg)">${gc} gaps</span>`:''}</button>
    <button class="tab${mainTab==='registry'?' active':''}" onclick="switchTab('registry')">Registry<span class="tab-badge">${REGISTRY.length}</span></button>`;
}
function switchTab(t){mainTab=t;currentFilter='All';currentType='All';currentAuthor='All';renderAll()}

function getAuthors(src){
  return[...new Set(src.flatMap(d=>(d.author||'').split(',').map(a=>a.trim())).filter(Boolean))].sort();
}

function renderFilters(){
  const el=document.getElementById('subFilters');
  if(mainTab==='workflows'){
    const teams=[...new Set([...TEAMS,...WORKFLOWS.map(w=>w.team)])];
    const au=getAuthors(WORKFLOWS);
    let h=`<button class="filter${currentFilter==='All'?' active':''}" onclick="sf('All')">전체</button>`;
    teams.forEach(t=>{h+=`<button class="filter${currentFilter===t?' active':''}" onclick="sf('${t}')">${t}</button>`});
    if(au.length){h+=`<span class="filter-sep"></span><button class="filter author${currentAuthor==='All'?' active':''}" onclick="sa('All')">전체 멤버</button>`;au.forEach(a=>{h+=`<button class="filter author${currentAuthor===a?' active':''}" onclick="sa('${a}')">${a}</button>`})}
    el.innerHTML=h;
  }else{
    const cats=[...new Set(REGISTRY.map(d=>d.category))].sort();
    const types=[...new Set(REGISTRY.map(d=>d.type))];
    const au=getAuthors(REGISTRY);
    let h=`<button class="filter${currentFilter==='All'?' active':''}" onclick="sf('All')">전체</button>`;
    cats.forEach(c=>{h+=`<button class="filter${currentFilter===c?' active':''}" onclick="sf('${c}')">${c}</button>`});
    h+=`<span class="filter-sep"></span>`;
    types.forEach(t=>{h+=`<button class="filter${currentType===t?' active':''}" onclick="st('${t}')">${TL[t]||t}</button>`});
    if(au.length){h+=`<span class="filter-sep"></span><button class="filter author${currentAuthor==='All'?' active':''}" onclick="sa('All')">전체 멤버</button>`;au.forEach(a=>{h+=`<button class="filter author${currentAuthor===a?' active':''}" onclick="sa('${a}')">${a}</button>`})}
    el.innerHTML=h;
  }
}
function sf(f){currentFilter=f;renderFilters();renderContent()}
function st(t){currentType=currentType===t?'All':t;renderFilters();renderContent()}
function sa(a){currentAuthor=a;renderFilters();renderContent()}
function matchAuth(a){return currentAuthor==='All'||(a||'').split(',').map(s=>s.trim()).includes(currentAuthor)}
function renderContent(){mainTab==='workflows'?renderWF():renderReg()}

// ── Workflows ──
function renderWF(){
  const q=document.getElementById('search').value.toLowerCase();
  let items=WORKFLOWS;
  if(currentFilter!=='All')items=items.filter(w=>w.team===currentFilter);
  if(currentAuthor!=='All')items=items.filter(w=>matchAuth(w.author));
  if(q)items=items.filter(w=>w.name.toLowerCase().includes(q)||w.description.toLowerCase().includes(q)||w.team.toLowerCase().includes(q));
  document.getElementById('content').innerHTML=`<div class="wf-list">${items.map(wfHTML).join('')}</div>`+guideHTML();
}
function toggleWf(el){el.closest('.wf-card').classList.toggle('open')}
function wfHTML(wf){
  const ac=wf.steps.filter(s=>s.type==='agent').length+(wf.parallel||[]).length;
  const hc=wf.steps.filter(s=>s.type==='human').length;
  let steps=wf.steps.map(stepHTML).join('');
  if(wf.parallel)steps+=wf.parallel.map(p=>`<div class="pipe-parallel"><div class="pipe-parallel-tag">${p.label||'병렬 트랙'}</div><div class="pipe-label"><span>${p.name}</span><span class="pipe-badge agent">에이전트</span></div><div class="pipe-desc">${p.description}</div>${p.tools?.length?`<div class="pipe-tools">${p.tools.map(t=>`<span class="pipe-tool">${t}</span>`).join('')}</div>`:''}${p.output?`<div class="pipe-output">\u2192 ${p.output}</div>`:''}</div>`).join('');
  return`<div class="wf-card${wf.steps.length<=5?' open':''}"><div class="wf-head" onclick="toggleWf(this)"><span class="wf-team">${wf.team}</span><span class="wf-title">${wf.name}</span><div class="wf-info"><span style="font-size:11px;color:var(--text3)">by ${wf.author||'미지정'}</span><span style="color:var(--accent)">\u{1F916} ${ac}</span><span style="color:var(--orange)">\u{1F464} ${hc}</span></div><span class="wf-chevron">\u203A</span></div><div class="wf-body"><div class="wf-desc">${wf.description}</div><div class="wf-legend"><div class="legend-item"><div class="legend-dot agent"></div>에이전트</div><div class="legend-item"><div class="legend-dot human"></div>사람</div><div class="legend-item"><div class="legend-dot trigger"></div>트리거</div></div><div class="pipeline">${steps}</div><div class="wf-author-edit"><span class="detail-label">담당자</span><input class="author-input" value="${wf.author||''}" placeholder="이름" onclick="event.stopPropagation()" onchange="updateWfAuth('${wf.id}',this.value)"/></div></div></div>`;
}
function stepHTML(s){
  const t=s.type,label=t==='agent'?'에이전트':t==='human'?'사람':'트리거';
  const tools=(s.tools||[]).map(t=>`<span class="pipe-tool">${t}</span>`).join('');
  return`<div class="pipe-step"><div class="pipe-rail"><div class="pipe-dot ${t}"></div><div class="pipe-line"></div></div><div class="pipe-body"><div class="pipe-inner${s.gap?' gap':''}"><div class="pipe-label"><span>${s.name}</span><span class="pipe-badge ${t}">${label}</span>${s.gap?'<span class="pipe-badge gap">GAP</span>':''}${s.who?`<span class="pipe-who">${s.who}</span>`:''}</div><div class="pipe-desc">${s.description}</div>${tools?`<div class="pipe-tools">${tools}</div>`:''}${s.output?`<div class="pipe-output">\u2192 ${s.output}</div>`:''}${s.rejectTo?`<div class="pipe-reject">\u21A9 REJECTED \u2192 ${s.rejectTo}</div>`:''}${s.exitCondition?`<div class="pipe-reject" style="color:var(--orange)">\u2197 ${s.exitCondition}</div>`:''}</div></div></div>`;
}

// ── Guide ──
function guideHTML(){
  return`<div class="guide"><h3>워크플로우 또는 에이전트 추가하기</h3><p>팀에서 사용하는 에이전트, 스킬, 자동화를 등록할 수 있습니다.</p><div class="guide-steps"><div class="guide-step"><div class="guide-num">1</div><div><strong>UI로 등록</strong> \u2014 오른쪽 위 <strong>+ 등록</strong> 버튼으로 JSON 생성</div></div><div class="guide-step"><div class="guide-num">2</div><div><strong>JSON 직접 편집</strong> \u2014 <code>data/registry.json</code> 또는 <code>data/workflows.json</code>에 PR</div></div><div class="guide-step"><div class="guide-num">3</div><div><strong>Claude Code</strong> \u2014 <code>~/skill-dashboard</code>에서 "대시보드 업데이트해줘"</div></div></div><div class="guide-actions"><a class="btn" href="https://github.com/Routinery/skill-dashboard" target="_blank">GitHub</a><a class="btn" href="https://app.notion.com/p/routinery/Routinery-667a9e216c774316b024301b9cca66a3" target="_blank">Notion</a><button class="btn btn-primary" onclick="openForm()">+ 등록</button></div></div>`;
}

// ── Registry ──
function renderReg(){
  const q=document.getElementById('search').value.toLowerCase();
  let items=REGISTRY;
  if(currentFilter!=='All')items=items.filter(d=>d.category===currentFilter);
  if(currentType!=='All')items=items.filter(d=>d.type===currentType);
  if(currentAuthor!=='All')items=items.filter(d=>matchAuth(d.author));
  if(q)items=items.filter(d=>d.name.toLowerCase().includes(q)||d.description.toLowerCase().includes(q)||(d.command||'').toLowerCase().includes(q)||(d.author||'').toLowerCase().includes(q)||(d.integrations||[]).some(i=>i.toLowerCase().includes(q)));
  const tp={};REGISTRY.forEach(d=>{tp[d.type]=(tp[d.type]||0)+1});
  const au=new Set(REGISTRY.map(d=>d.author).filter(Boolean));
  let h=`<div class="stats"><div class="stat"><div class="stat-val">${REGISTRY.length}</div><div class="stat-label">전체</div></div><div class="stat"><div class="stat-val">${tp.agent||0}</div><div class="stat-label">에이전트</div></div><div class="stat"><div class="stat-val">${tp.skill||0}</div><div class="stat-label">스킬</div></div><div class="stat"><div class="stat-val">${tp.automation||0}</div><div class="stat-label">자동화</div></div><div class="stat"><div class="stat-val">${au.size}</div><div class="stat-label">기여자</div></div></div>`;
  if(!items.length)h+=`<div class="empty">검색 결과가 없습니다.</div>`;
  else h+=`<div class="grid">${items.map(cardHTML).join('')}</div>`;
  h+=guideHTML();
  document.getElementById('content').innerHTML=h;
}
function cardHTML(d){
  const ints=(d.integrations||[]).slice(0,3).map(i=>`<span class="tag tag-int">${i}</span>`).join('');
  const extra=(d.integrations||[]).length>3?`<span class="tag">+${d.integrations.length-3}</span>`:'';
  return`<div class="card" onclick="toggleCard(this,event)">${d.schedule?`<div class="card-schedule">${d.schedule}</div>`:''}<div class="card-head"><span class="card-emoji">${d.icon||'\u{1F527}'}</span><div><div class="card-name">${d.name}</div>${d.command?`<div class="card-cmd">${d.command}</div>`:''}</div></div><div class="card-desc">${d.description}</div><div class="card-tags"><span class="tag tag-type">${TL[d.type]||d.type}</span><span class="tag tag-platform">${d.platform}</span>${ints}${extra}</div><div class="card-footer"><span>by ${d.author||'미지정'}</span></div><div class="card-detail">${d.input?`<div class="detail-row"><span class="detail-label">입력</span><span>${d.input}</span></div>`:''}${d.output?`<div class="detail-row"><span class="detail-label">출력</span><span>${d.output}</span></div>`:''}${d.trigger?`<div class="detail-row"><span class="detail-label">실행</span><span>${d.trigger}</span></div>`:''}<div class="detail-row"><span class="detail-label">담당자</span><input class="author-input" value="${d.author||''}" placeholder="이름" onclick="event.stopPropagation()" onchange="updateAuth('${d.id}',this.value)"/></div></div></div>`;
}
function toggleCard(el,e){if(e.target.closest('.author-input'))return;el.classList.toggle('expanded')}
function updateAuth(id,v){const d=REGISTRY.find(d=>d.id===id);if(d){d.author=v.trim();toast(v.trim()?'담당자: '+v.trim():'담당자 해제됨');renderFilters()}}
function updateWfAuth(id,v){const w=WORKFLOWS.find(w=>w.id===id);if(w){w.author=v.trim();toast(v.trim()?'담당자: '+v.trim():'담당자 해제됨');renderFilters();renderContent()}}

// ── Form ──
function openForm(){document.getElementById('formModal').classList.add('show');document.getElementById('formOutput').innerHTML=''}
function closeForm(){document.getElementById('formModal').classList.remove('show')}
document.getElementById('formModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeForm()});
function generateEntry(){
  const name=$('f-name').value.trim(),desc=$('f-desc').value.trim(),cat=$('f-category').value,type=$('f-type').value,author=$('f-author').value.trim();
  if(!name||!desc||!cat||!type||!author){alert('필수 항목(*)을 모두 입력해주세요.');return}
  const id=($('f-command').value||name).replace(/^\//,'').replace(/\s+/g,'-').toLowerCase();
  const entry={id,name,command:$('f-command').value.trim()||undefined,description:desc,category:cat,type,platform:$('f-platform').value,trigger:$('f-trigger').value,input:$('f-input').value.trim()||undefined,output:$('f-output').value.trim()||undefined,integrations:$('f-integrations').value.split(',').map(s=>s.trim()).filter(Boolean),icon:$('f-icon').value.trim()||undefined,author,schedule:$('f-schedule').value.trim()||undefined,updatedAt:new Date().toISOString().split('T')[0]};
  Object.keys(entry).forEach(k=>entry[k]===undefined&&delete entry[k]);
  const json=JSON.stringify(entry,null,2);
  $('formOutput').innerHTML=`<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)"><div style="font-size:13px;font-weight:600;margin-bottom:6px">생성된 JSON</div><div class="output-box">${esc(json)}</div><div style="display:flex;gap:8px"><button class="btn" onclick="copyText(\`${json.replace(/`/g,'\\`')}\`)">복사</button><button class="btn btn-primary" onclick='addLocal(${escA(json)})'>바로 추가</button></div><p style="font-size:11px;color:var(--text3);margin-top:8px">영구 반영: <code>data/registry.json</code>에 추가 후 push</p></div>`;
}
function $(id){return document.getElementById(id)}
function addLocal(e){if(typeof e==='string')e=JSON.parse(e);REGISTRY.push(e);closeForm();renderAll();toast('추가됨 (이 세션만)')}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escA(s){return s.replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;')}
function exportJSON(){const b=new Blob([JSON.stringify({registry:REGISTRY,workflows:WORKFLOWS},null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='skill-dashboard-export.json';a.click();URL.revokeObjectURL(u)}
function copyText(t){navigator.clipboard.writeText(t);toast('복사되었습니다')}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}

loadData();
</script>
</body>
</html>
